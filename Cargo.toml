[workspace]
resolver = "2"

[package]
name = "waterui-math"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/math"
description = "Mathematical formula rendering for WaterUI, laid out against the OpenType MATH table"
keywords = ["math", "latex", "mathml", "opentype", "waterui"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-layout = "0.5.0"
suiteki = { version = "0.1", features = ["nami"] }
nami = "=0.11.1"
# The math family is looked up in the application's shared font collection,
# which the host installs and this crate only reads: `parley` is here for the
# `FontContext` that collection hands out, not to discover fonts.
parley = { version = "0.11", default-features = false, features = ["std"] }
# `system-fonts` is what lets a host with no font stack of its own — the native
# Apple, Android and GTK backends — install a collection at all. A formula is
# typeset from real faces, so a build carrying this component must be able to
# reach them.
waterui-text = { version = "0.5.0", features = ["system-fonts"] }
kurbo = "0.13"
peniko = "0.6"
cherenkov = "0.0.0"
ttf-parser = "0.25"
pulldown-latex = "0.8"
quick-xml = "0.42"
# Speech. A formula drawn as filled paths has no content an assistive technology
# can reach, and the MathML this crate publishes is markup rather than a
# sentence — this is what turns one into the other, and the result is the name
# the formula's accessibility node carries. Not optional: a component that
# cannot be read out has no accessibility tree worth the name, and a crate this
# one is not linked into pays nothing for it.
mathcat = { version = "0.7.5", features = ["include-zip"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"

[dev-dependencies]
# The gallery renders through both offscreen engines: `gpu` for the GPU
# pipeline a live surface uses, `cpu` for the CPU rasteriser pictures go
# through.
waterui-graphics = { version = "0.5.0", default-features = false, features = [
    "gpu",
    "cpu",
] }
waterui = "0.5.0"
waterui-testing = "0.5.0"

# The formula font. Layout reads the OpenType `MATH` table, so a face without
# one cannot lay out a formula at all; this is the default the component asks
# for when the environment names no other math family.
[[package.metadata.waterui.assets.font]]
name = "STIX Two Math"

