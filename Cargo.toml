# The split-out component crates. The ones moving to nami 0.12 alongside
# this crate (barcode, canvas, chart, map-gpu, video-gpu) ride the commit on
# their own nami 0.12 branches that changes only the package requirement,
# since the revisions waterui's table names are still on nami 0.11; image,
# particle and svg ride the revisions waterui's own table pins at cc756f574.
# `waterui-math` itself is the local crate, patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "d5ac6ff3d08dc8cd8c9c1cd457439ffe470b62a5" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", rev = "971de634f97127eab3c5912c1a62993ccc939da8" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "54319cbc41cc624c3a662f22f3ab18eacd84fd8a" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "85f64a55f531738049a4188ffec544501b1a15b0" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "4364f1ece5373bf322ea99cde595d7b4ec6958dc" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "b32b6f2a3cbd114ce622a91a6f4c7e4f1c1d98b3" }

# The renderer and its theme, at the revisions the framework's own patch
# table pins: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework revision
# as every `waterui-*` crate; its Material 3 theme is still external and
# rides the rev the framework pins.
hydrolysis = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "bc412a1a7e796cedc30d2c62d33fe293634574a8" }

