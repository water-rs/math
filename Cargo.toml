[workspace]
resolver = "2"

[package]
name = "waterui-math"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/math"
description = "Mathematical formula rendering for WaterUI, laid out against the OpenType MATH table"
keywords = ["math", "latex", "mathml", "opentype", "waterui"]
categories = ["gui"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
waterui-core = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-layout = "0.5.0"
suiteki = { version = "0.1", features = ["nami"] }
nami = "0.13"
# The math family is looked up in the application's shared font collection,
# which the host installs and this crate only reads: `parley` is here for the
# `FontContext` that collection hands out, not to discover fonts.
parley = { version = "0.11", default-features = false, features = ["std"] }
# `system-fonts` is what lets a host with no font stack of its own — the native
# Apple, Android and GTK backends — install a collection at all. A formula is
# typeset from real faces, so a build carrying this component must be able to
# reach them.
waterui-text = { version = "0.5.0", features = ["system-fonts"] }
kurbo = "0.13"
peniko = "0.6"
ttf-parser = "0.25"
pulldown-latex = "0.8"
quick-xml = "0.42"
# Speech. A formula drawn as filled paths has no content an assistive technology
# can reach, and the MathML this crate publishes is markup rather than a
# sentence — this is what turns one into the other, and the result is the name
# the formula's accessibility node carries. Not optional: a component that
# cannot be read out has no accessibility tree worth the name, and a crate this
# one is not linked into pays nothing for it.
mathcat = { version = "0.7.5", features = ["include-zip"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"

[dev-dependencies]
# The gallery renders through both offscreen engines: `gpu` for the GPU
# pipeline a live surface uses, `cpu` for the CPU rasteriser pictures go
# through.
waterui-graphics = { version = "0.5.0", default-features = false, features = [
    "gpu",
    "cpu",
] }
waterui = "0.5.0"
waterui-testing = "0.5.0"

# The formula font. Layout reads the OpenType `MATH` table, so a face without
# one cannot lay out a formula at all; this is the default the component asks
# for when the environment names no other math family.
[[package.metadata.waterui.assets.font]]
name = "STIX Two Math"

# Registry dependencies do not carry their own patch table, so the
# framework's pins are repeated here for this graph to resolve the same
# sources as water-rs/waterui on `feat/2633-nami-0.13`: every
# `waterui-*` crate this crate reaches, directly or transitively, is the
# same monorepo commit, and the cherenkov/filtrate family moved into that
# repository under `graphics/` (water-rs/waterui#1449) — the stand-alone
# cherenkov repository is no longer the source.
[patch.crates-io]
# The crate under test stands in for the published `waterui-math` the facade
# and the test graph name.
waterui-math = { path = "." }

# The waterui monorepo on `feat/2633-nami-0.13`, which moves the framework
# to nami 0.13 / nami-core 0.5 (water-rs/waterui#2633), with the exact commit
# recorded in `Cargo.lock`. It carries the render-target-neutral recording
# contract (water-rs/waterui#1435): `SceneContent::build_scene` records into
# `cherenkov_record::Recorder`, re-exported as `waterui_graphics::draw`,
# and `SceneResources` registers through the target's `SceneBackend`/
# `ShaderBackend` registry, returning `Registered` handles that name the
# plain ids (`FontId`, `ImageId`, `ShaderId`) a recording draws with.
waterui = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-icons-codegen = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-icons-lucide = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-mcp = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-mcp-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-video = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "dev" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# The split-out component crates. The ones moving to nami 0.13 alongside
# this crate (barcode, canvas, chart, map-gpu, video-gpu) ride their own
# `feat/nami-0.13` branches, since the revisions waterui's table names are
# still on nami 0.12; image, particle and svg ride the revisions waterui's
# own table pins.
# `waterui-math` itself is the local crate, patched at the top of the table.
waterui-barcode = { git = "https://github.com/water-rs/barcode", branch = "dev" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", branch = "dev" }
waterui-chart = { git = "https://github.com/water-rs/chart", branch = "dev" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "a36e16c555bd78ade9e28fad947af66a52f8f071" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", branch = "dev" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "bf663af85211d1f0bcce511b94ac435efad046a6" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", branch = "dev" }

# The renderer and its theme, from the sources the framework's own patch
# table names: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework commit
# as every `waterui-*` crate; its Material 3 theme is still external and
# follows its `dev`, as the framework's does.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "dev" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", branch = "dev" }

# The Cherenkov engine family and its filtrate members, in-tree under
# `graphics/` in water-rs/waterui (water-rs/waterui#1449). Every filtrate in
# the graph must come from this same commit or a filter type built on one
# side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "dev" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", branch = "dev" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate-core = { git = "https://github.com/water-rs/waterui", branch = "dev" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", branch = "dev" }

# WaterKit from waterkit's `dev`, the source waterui's own table names, with
# the exact commit recorded in `Cargo.lock`, so the graph holds one copy of
# each crate.
waterkit-audio = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", branch = "dev" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki's
# `dev` implements 0.5's (water-rs/suiteki#29), the source waterui's own
# table names. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "dev" }

# Third-party forks the framework itself patches.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# Mirrored from the in-tree cherenkov workspace patch (water-rs/cherenkov#229,
# carried into water-rs/waterui).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
