name: Install STIX Two Math
description: >
  Installs STIXTwoMath-Regular.otf — the face the typesetting tests lay
  formulae out against — from the pinned upstream tag
  (stipub/stixfonts v2.13b171, commit
  744a22a4dd626cd14d75728aef34fc8ad7c85db0), verifies its SHA-256 before
  installing, then registers it per-user: fontconfig on Linux, the
  per-user Fonts registry key on Windows. macOS ships the face already,
  so there is no macOS step.

runs:
  using: composite
  steps:
    - name: Install STIX Two Math (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        STIX_URL: https://github.com/stipub/stixfonts/raw/744a22a4dd626cd14d75728aef34fc8ad7c85db0/fonts/static_otf/STIXTwoMath-Regular.otf
        STIX_SHA256: 3a5f3f26f40d5698b3c62dd085d48d6663696a3f80825aab8b553d5097518e8c
      run: |
        set -euo pipefail
        font_dir="$HOME/.local/share/fonts"
        mkdir -p "$font_dir"
        curl -fsSL "$STIX_URL" -o "$font_dir/STIXTwoMath-Regular.otf"
        echo "$STIX_SHA256  $font_dir/STIXTwoMath-Regular.otf" | sha256sum -c -
        fc-cache -f
        fc-list | grep -i 'STIX Two Math'
    - name: Install STIX Two Math (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        STIX_URL: https://github.com/stipub/stixfonts/raw/744a22a4dd626cd14d75728aef34fc8ad7c85db0/fonts/static_otf/STIXTwoMath-Regular.otf
        STIX_SHA256: 3a5f3f26f40d5698b3c62dd085d48d6663696a3f80825aab8b553d5097518e8c
      run: |
        $ErrorActionPreference = 'Stop'
        $fontDir = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\Fonts'
        New-Item -ItemType Directory -Force $fontDir | Out-Null
        $fontPath = Join-Path $fontDir 'STIXTwoMath-Regular.otf'
        Invoke-WebRequest -Uri $env:STIX_URL -OutFile $fontPath
        $actual = (Get-FileHash -Algorithm SHA256 $fontPath).Hash.ToLower()
        if ($actual -ne $env:STIX_SHA256.ToLower()) {
          throw "STIXTwoMath-Regular.otf SHA-256 mismatch: expected $($env:STIX_SHA256), got $actual"
        }
        $fontsKey = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
        New-ItemProperty -Path $fontsKey -Name 'STIX Two Math (OpenType)' -Value $fontPath -PropertyType String -Force | Out-Null
